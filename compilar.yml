name: Compilar NOVARJ7

on:
  workflow_dispatch:
  push:
    paths:
      - 'novarj7.pwn'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar compilador Pawn
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc
          git clone --depth 1 https://github.com/pawn-lang/compiler.git pawn-compiler
          cd pawn-compiler
          make
